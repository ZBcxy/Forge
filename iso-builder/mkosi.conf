# Forge OS ISO Builder
#
# Build command:
#   sudo mkosi -f --distribution ubuntu --release 24.04 --output forge-os.iso
#
# Or use the build script:
#   ./scripts/build-iso.sh

[Distribution]
Distribution=ubuntu
Release=24.04
Architecture=amd64

[Output]
Format=disk
# Output as ISO9660 for USB boot
OutputDirectory=./output
CompressOutput=yes
# Also produce a hybrid ISO for both BIOS and UEFI
# We use 'disk' format and then convert with xorriso for hybrid ISO

[Content]
# Root filesystem overlay
# Everything in ./overlay/ is copied to /
Packages=
    linux-image-generic
    systemd-boot
    grub-pc-bin
    grub-efi-amd64-bin
    grub-efi-ia32-bin
    mtools
    dosfstools
    xorriso
    alsa-utils
    pulseaudio
    libasound2
    mesa-vulkan-drivers
    libegl1-mesa
    libgl1-mesa-dri
    libgles2
    # For camera
    v4l-utils
    libv4l-0
    # System essentials
    curl
    wget
    ca-certificates
    # Fonts
    fonts-inter
    fonts-jetbrains-mono

[Host]
# Extra search paths for package manager
ExtraSearchPaths=

[Validation]
# Skip checksum verification for speed
CheckSum=

# Boot configuration for mkosi.extra
# We overlay our custom /etc and /usr/bin
# See overlay/ directory
