[workspace]
members = [
    "forge-init",
    "forge-svc",
    "forge-hal",
    "forge-llm",
    "forge-voice",
    "forge-agent",
    "forge-gui",
    "forge-theme",
    "forge-guard",
]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ZBcxy/Forge"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"
thiserror = "2"
log = "0.4"